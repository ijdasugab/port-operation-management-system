version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: portops-postgres
    environment:
      POSTGRES_DB: portops
      POSTGRES_USER: portops
      POSTGRES_PASSWORD: portops_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portops -d portops"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: portops-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portops
    profiles:
      - app

volumes:
  postgres_data:
